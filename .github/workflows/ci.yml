name: PayFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: payflow
          MYSQL_USER: payflow
          MYSQL_PASSWORD: payflow
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -prootpass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Load database schema
        run: |
          mysql -h 127.0.0.1 -P 3307 -u payflow -ppayflow payflow < sql/schema/01_create_database.sql

      - name: Run pytest
        run: pytest tests/ -v

  dbt-tests:
    runs-on: ubuntu-latest
    needs: python-tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: payflow
          MYSQL_USER: payflow
          MYSQL_PASSWORD: payflow
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -prootpass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dbt.txt

      - name: Set up dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          payflow_dbt:
            target: dev
            outputs:
              dev:
                type: mysql
                server: 127.0.0.1
                port: 3307
                database: payflow
                schema: payflow
                username: payflow
                password: payflow
                driver: MySQL ODBC 8.0 ANSI Driver
          EOF

      - name: Load schema and sample data
        run: |
          mysql -h 127.0.0.1 -P 3307 -u payflow -ppayflow payflow < sql/schema/01_create_database.sql
          mysql -h 127.0.0.1 -P 3307 -u payflow -ppayflow payflow < data/sample/seed_data.sql
          mysql -h 127.0.0.1 -P 3307 -u payflow -ppayflow payflow < data/sample/seed_gateway_transactions.sql

      - name: Run dbt
        working-directory: payflow_dbt
        run: |
          dbt run
          dbt test
